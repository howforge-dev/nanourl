# nginx site for the nanourl web app (web/dist), a self-hosted alternative
# to Cloudflare Pages/Netlify (see web/README.md); mirrors web/_headers so
# the app behaves identically wherever it's served from. The mirroring is
# checked: web/tests/headers.test.ts parses this file and web/_headers and
# compares the emitted headers per path.
#
# TLS IS REQUIRED, not optional hardening. Over plain HTTP on a non-localhost
# host the page is not a secure context, and the app fails to load outright
# rather than degrading:
#
#   * `crypto.subtle` is undefined, so loader.ts's sha256Hex (which verifies
#     every downloaded chunk) throws and the codec never loads. The loader
#     names that failure explicitly instead of surfacing a bare TypeError,
#     but it is still a hard failure.
#   * `SharedArrayBuffer` is unavailable regardless of the COOP/COEP headers
#     below, so `crossOriginIsolated` can never be true and the multi-threaded
#     tier this config exists to enable is structurally unreachable.
#   * `caches` is unavailable, so a returning visitor re-downloads ~125 MiB
#     every visit.
#
# Cloudflare Pages and Netlify are HTTPS-only, so a plain-HTTP nginx box is
# the one deploy target where TLS is not already guaranteed by the platform;
# this config enforces it itself.
#
# Deploy:
#   rsync -a --delete web/dist/ host:/srv/nanourl/
#
# Install (once per host):
#   copy tools/web/nginx-nanourl.conf to /etc/nginx/sites-available/nanourl
#   ln -sf ../sites-available/nanourl /etc/nginx/sites-enabled/nanourl
#   # edit server_name and the two ssl_certificate paths below, then:
#   nginx -t && systemctl reload nginx
#
# Getting a certificate (pick one):
#   * Let's Encrypt via certbot, the usual choice, free and auto-renewing:
#       apt install certbot python3-certbot-nginx
#       certbot --nginx -d nanourl.example.com
#     certbot rewrites the two ssl_certificate lines below to
#     /etc/letsencrypt/live/<domain>/{fullchain,privkey}.pem and installs a
#     renewal timer. Run it AFTER this file is in place and `nginx -t` passes.
#   * A certificate you already have: point the two paths at your
#     fullchain (leaf + intermediates) and private key.
#   * Terminating TLS in front of nginx (a load balancer, Cloudflare, Caddy):
#     then delete the 443 block and keep only the port-80 one, but make sure
#     the proxy in front speaks HTTPS to the browser; the app needs a secure
#     context at the *browser*, not at nginx.

# Model/tokenizer/wasm chunks are content-hashed (the name changes when the
# bytes do), so they can be cached forever; the same goes for Vite's own
# hashed JS/CSS under /assets/ (mirrors web/_headers' separate `/assets/*`
# rule). Everything else (the HTML pages, which reference those hashed
# names) must be revalidated on every load or a deploy would never reach a
# returning visitor. nginx's default ETag makes that revalidation a cheap
# 304 instead of a full re-download.
#
# Unlike Cloudflare's `_headers`, an nginx `map` yields exactly ONE value, so
# there is no comma-joining hazard here and no `!` clearing needed.
map $uri $cache_control {
    default      "no-cache";
    ~*\.bin$     "public, max-age=31536000, immutable";
    ~^/assets/   "public, max-age=31536000, immutable";
}

# Plain HTTP: redirect everything to HTTPS. Nothing is served here; see the
# secure-context note at the top of this file.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 308 rather than 301: preserves the method and is not cached as
    # permanently as a 301 by intermediaries that guessed wrong once.
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # PLACEHOLDERS: replace with your real certificate paths (see the
    # "Getting a certificate" note at the top). `nginx -t` fails until these
    # point at files that exist, which is the intended behaviour: a config
    # that silently fell back to plain HTTP would ship the broken deploy this
    # block exists to prevent.
    ssl_certificate     /etc/letsencrypt/live/nanourl.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nanourl.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /srv/nanourl;
    index index.html;
    charset utf-8;

    # Byte ranges are on by default (sendfile serves them directly), which is
    # what lets an interrupted ~125 MiB model download resume instead of
    # restarting. nginx only drops ranges for a response it gzips on the
    # fly, which is why the large model .bin chunks (near-incompressible
    # int4 weights, application/octet-stream) are deliberately absent from
    # gzip_types below: real text/wasm gets to compress, the model chunks
    # always keep ranges.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    add_header Cache-Control              $cache_control always;
    add_header X-Content-Type-Options     nosniff always;
    add_header Referrer-Policy            strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # pack-assets.ts names: tokenizer.<sha8>.json.bin, urlcodec[-mt].<sha8>.wasm.bin
    location ~* \.json\.bin$ {
        types { }
        default_type application/json;
    }

    location ~* \.wasm\.bin$ {
        types { }
        default_type application/wasm;
    }

    # /sw.js needs no block of its own: the map's default (no-cache) already
    # covers it, and a location-level add_header would replace, not merge,
    # the server-level header set.

    location / {
        try_files $uri $uri/ =404;
    }
}
