# Cloudflare Worker serving the built site as static assets (assets-only, no
# script). `dist/_headers` is applied by the assets layer, which is what gives
# the pages cross-origin isolation and the hashed chunks their immutable
# caching. Deployed by .github/workflows/ci.yml with `wrangler deploy`.
name = "nanourl"
compatibility_date = "2026-09-01"
# The account's workers.dev subdomain and preview URLs stay off (and out of
# deploy logs).
workers_dev = false
preview_urls = false

# The site's own paths, as zone routes. Everything the site ships lives under
# `/assets/` (src/lib/assetPath.ts), so one route carries the lot; the pages
# are one more, and `sw.js` is the one file that cannot move, a worker being
# confined to the folder it is served from. `robots.txt` needs no route: the
# site ships none, and the zone's own managed one answers regardless.
# Anything on the apex matching none of these is not the site's and goes to
# the zone's origin, where the online shortener lives. The compressed links live after '#' and never reach the
# server, so `qv.lc/` alone carries them.
#
# A pattern is matched against the whole URL, query string and all, so each
# name carries a trailing wildcard: without it a shared `?utm_source=...`
# link reaches the shortener and is told it is not a link. The apex cannot be
# covered that way, since Cloudflare refuses a '?' in a pattern and a bare
# `qv.lc/*` would swallow every slug; `php/index.php` sends `qv.lc/?...` back
# to `qv.lc/` instead. None of these can match a slug, which is letters and
# digits with no dot and no folder.
routes = [
  { pattern = "qv.lc/", zone_name = "qv.lc" },
  { pattern = "qv.lc/*.html*", zone_name = "qv.lc" },
  { pattern = "qv.lc/assets/*", zone_name = "qv.lc" },
  { pattern = "qv.lc/sw.js*", zone_name = "qv.lc" },
]

[assets]
directory = "./web/dist"
# Pages are linked as `/learn.html`; any rewrite to `/learn` would redirect
# every navigation and break the service worker's precache of those paths.
html_handling = "none"
not_found_handling = "404-page"

# Workers Logs for the assets Worker: request logs and errors in the dashboard.
[observability]
enabled = true
head_sampling_rate = 1
