# Toolchain for nanourl. CI installs the same versions through jdx/mise-action,
# so a local build and a CI build run identical tools.
# Rust is deliberately absent: rustup owns the compiler, and
# rust/rust-toolchain.toml names the one pinned version every build (and the
# wasm digest pin) depends on. A mise-installed rustc would shadow it.
[tools]
task = "latest"
node = "22"
pnpm = "10"

[settings]
# CI runs non-interactively; never prompt.
idiomatic_version_file_enable_tools = []
